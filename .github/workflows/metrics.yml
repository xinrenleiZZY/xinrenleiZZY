name: Profile metrics (self-generated SVG)

# 每天把统计卡片渲染成 SVG 并提交回仓库，README 里用相对路径引用即可。
# 好处：不依赖第三方统计网站（github-readme-stats 公共实例经常 503 / 国内慢）。
on:
  schedule:
    - cron: "30 2 * * *" # 每天 UTC 02:30（北京时间 10:30）
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须：Action 要提交 assets/generated/metrics.svg
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: xinrenleiZZY
          filename: assets/generated/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
